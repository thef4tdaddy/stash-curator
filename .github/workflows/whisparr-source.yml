name: Update custom plugins in preview source

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize with full Curator preview publication to avoid replacing its indexes.
concurrency:
  group: stashui-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'thef4tdaddy/stash-curator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: thef4tdaddy/whisparr-sync
          ref: 542d0c361eb0c34dec0ae94406c8138bf523e600
          path: companion-whisparr
          persist-credentials: false
      - name: Download existing indexes without rebuilding Curator
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download stashui-preview --pattern 'index*.yml' --dir preview
      - name: Package and extend all preview indexes
        run: python scripts/add_whisparr_source.py --source companion-whisparr --output preview --repository "${{ github.repository }}"
      - uses: actions/checkout@v6
        with:
          repository: thef4tdaddy/stash-filemonitor
          ref: ce0e41149c6c0475e5039f1650b217c26776c507
          path: companion-filemonitor
          persist-credentials: false
      - name: Package custom FileMonitor host tools
        run: python scripts/add_filemonitor_source.py --source companion-filemonitor --output preview --repository "${{ github.repository }}"
      - name: Publish archive before replacing indexes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh release view stashui-preview --json assets --jq '.assets[].name')
          for file in preview/*.zip; do
            archive=$(basename "$file")
            if grep -Fxq -- "$archive" <<< "$existing"; then
              gh release download stashui-preview --pattern "$archive" --dir previous
              cmp "$file" "previous/$archive"
            else
              gh release upload stashui-preview "$file"
            fi
          done
          gh release upload stashui-preview preview/index*.yml --clobber
